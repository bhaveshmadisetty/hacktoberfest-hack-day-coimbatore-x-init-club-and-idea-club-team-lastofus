<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Arbiter">
  <defs>
    <linearGradient id="arb-decided" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="arb-dismissed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Fulcrum: the notch reads as an implied "A" -->
  <path d="M24 7 L33 41 L28.5 41 L24 24 L19.5 41 L15 41 Z" fill="currentColor" opacity="0.92"/>
  <!-- Beam tilted 14deg: the scale has already ruled -->
  <g transform="rotate(-14 24 16)">
    <rect x="7" y="14.6" width="34" height="2.8" rx="1.4" fill="currentColor"/>
    <!-- Low pan, filled: the evidence that carried the decision -->
    <g transform="translate(9.5 16)">
      <line x1="0" y1="0" x2="0" y2="6.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M-6.5 6.5 A 6.5 6.5 0 0 0 6.5 6.5 Z" fill="url(#arb-decided)"/>
    </g>
    <!-- High pan, empty outline: the noise that was dismissed -->
    <g transform="translate(38.5 16)">
      <line x1="0" y1="0" x2="0" y2="6.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M-6.5 6.5 A 6.5 6.5 0 0 0 6.5 6.5 Z" fill="none" stroke="url(#arb-dismissed)" stroke-width="1.6"/>
    </g>
  </g>
</svg>
